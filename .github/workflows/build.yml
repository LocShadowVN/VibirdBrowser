name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build .deb and Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Pre-built Trunk & Cargo Binstall
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Auto-Sync Version From Git Tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.0.0"
          fi
          echo "Detected Release Version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "0,/version = \"[^\"]+\"/s/version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate Vibird Browser App Icons
        run: |
          mkdir -p src-tauri/icons
          cat << 'EOF' > src-tauri/icons/app-icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <radialGradient id="vBg" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#141923"/>
                <stop offset="100%" stop-color="#080A0F"/>
              </radialGradient>
            </defs>
            <rect width="512" height="512" rx="116" fill="url(#vBg)"/>
            <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#222A38" stroke-width="2"/>
            <circle cx="256" cy="256" r="176" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15" stroke-dasharray="8, 8"/>
            <circle cx="256" cy="256" r="140" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
            <polygon points="210,310 145,210 160,150 240,240" fill="#996515" opacity="0.6"/>
            <polygon points="160,150 120,170 190,265" fill="#784E0E" opacity="0.4"/>
            <polygon points="235,395 140,230 170,120 280,270" fill="#D4AF37"/>
            <polygon points="170,120 135,145 220,295 235,395" fill="#B38622"/>
            <path d="M 235 395 
                     C 270 330, 310 260, 350 200 
                     L 435 125 
                     L 365 170 
                     C 335 195, 305 240, 275 305 
                     Z" 
                  fill="#E6B800"/>
            <polygon points="435,125 365,170 375,150" fill="#FFF2B2"/>
            <polygon points="345,185 240,165 315,198" fill="#F3E5AB"/>
            <polygon points="330,200 205,185 295,215" fill="#D4AF37"/>
            <polygon points="310,218 190,208 275,235" fill="#B38622"/>
            <polygon points="235,395 285,390 260,425" fill="#D4AF37" opacity="0.85"/>
            <polygon points="215,380 235,395 200,410" fill="#996515"/>
          </svg>
          EOF
          cargo tauri icon src-tauri/icons/app-icon.svg -o src-tauri/icons

      # ==================================================================
      # FETCH LISTS
      # ==================================================================
      - name: Fetch EasyList (ads)
        run: |
          mkdir -p src-tauri/resources
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://easylist.to/easylist/easylist.txt" \
            -o src-tauri/resources/easylist_raw.txt \
            || echo "! easylist download failed" > src-tauri/resources/easylist_raw.txt
          LINES=$(wc -l < src-tauri/resources/easylist_raw.txt)
          echo "EasyList: $LINES lines"

      - name: Fetch EasyPrivacy (trackers)
        run: |
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://easylist.to/easylist/easyprivacy.txt" \
            -o src-tauri/resources/easyprivacy_raw.txt \
            || echo "! easyprivacy download failed" > src-tauri/resources/easyprivacy_raw.txt
          LINES=$(wc -l < src-tauri/resources/easyprivacy_raw.txt)
          echo "EasyPrivacy: $LINES lines"

      - name: Fetch Fanboy Annoyance (cookie banners, annoyances)
        run: |
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://secure.fanboy.co.nz/fanboy-annoyance.txt" \
            -o src-tauri/resources/fanboy_annoyance_raw.txt \
            || echo "! fanboy-annoyance download failed" > src-tauri/resources/fanboy_annoyance_raw.txt
          LINES=$(wc -l < src-tauri/resources/fanboy_annoyance_raw.txt)
          echo "Fanboy Annoyance: $LINES lines"

      # ==================================================================
      # MERGE RAW LISTS → rules.txt (cho adblock-rust engine)
      # ==================================================================
      - name: Merge Raw Lists for Rust Engine
        run: |
          cd src-tauri/resources
          {
            cat easylist_raw.txt
            cat easyprivacy_raw.txt
            cat fanboy_annoyance_raw.txt
          } > rules.txt
          LINES=$(wc -l < rules.txt)
          echo "Merged $LINES lines into rules.txt"

      # ==================================================================
      # DISTILL → 4 LAYERED ARTIFACTS
      #
      #  L1: content_filter.json  → WebKit DFA (~8k domain)
      #  L2: js_domains.json      → JS Set (cap 25k)
      #  L3: js_paths.json        → JS substring path rules
      #  L4: rules.txt            → adblock-rust (đã ở bước trên)
      # ==================================================================
      - name: Distill Lists → Layered Artifacts
        run: |
          python3 - <<'PY'
          import json, re, os
          from collections import Counter

          RES = "src-tauri/resources"
          DOMAIN_RE = re.compile(r'^[a-zA-Z0-9._-]+$')
          PATH_RE = re.compile(r'^/[a-zA-Z0-9_\-\./]{2,40}$')

          HARD_WL = {
              "google.com","googleapis.com","gstatic.com","googleusercontent.com",
              "googlevideo.com","gvt1.com","gvt2.com","youtube.com","ytimg.com",
              "ggpht.com","youtu.be","github.com","githubusercontent.com",
              "githubassets.com","gitlab.com","stackoverflow.com","stackexchange.com",
              "cloudflare.com","cloudflare-dns.com","jsdelivr.net","unpkg.com",
              "cdnjs.cloudflare.com","amazonaws.com","cloudfront.net",
              "stripe.com","paypal.com","recaptcha.net","hcaptcha.com",
              "challenges.cloudflare.com","fonts.googleapis.com","fonts.gstatic.com",
              "accounts.google.com","login.microsoftonline.com",
          }

          def is_hard_wl(domain):
              d = domain.lower()
              for w in HARD_WL:
                  if d == w or d.endswith("." + w):
                      return True
              return False

          SOURCES = ["easylist_raw.txt", "easyprivacy_raw.txt", "fanboy_annoyance_raw.txt"]

          domain_hits = Counter()
          path_rules = set()
          whitelist_domains = set()

          for src in SOURCES:
              p = os.path.join(RES, src)
              if not os.path.exists(p):
                  print(f"[{src}] missing, skip")
                  continue
              with open(p, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("!") or line.startswith("["):
                          continue

                      is_exc = line.startswith("@@")
                      if is_exc:
                          line = line[2:]
                      if "$" in line:
                          line = line.split("$", 1)[0]
                      if not line:
                          continue

                      if line.startswith("||"):
                          rest = line[2:]
                          domain = re.split(r"[\^/]", rest, 1)[0].strip()
                          if not domain or len(domain) > 128:
                              continue
                          if not DOMAIN_RE.match(domain) or "." not in domain:
                              continue
                          if is_exc:
                              whitelist_domains.add(domain.lower())
                          elif not is_hard_wl(domain):
                              domain_hits[domain.lower()] += 1
                          continue

                      if line.startswith("/") and PATH_RE.match(line):
                          path_rules.add(line)
                          continue

                      stripped = line.strip("*")
                      if 6 <= len(stripped) <= 32 and not any(c in stripped for c in "*^$"):
                          if any(c in stripped for c in "./_-"):
                              path_rules.add(stripped)
                          continue

          print(f"raw: {len(domain_hits)} unique domains, {len(path_rules)} path rules")

          # L1: WebKit DFA — top 8000 domain, không quá lớn cho DFA
          top_domains = [d for d, _ in domain_hits.most_common(8000)]
          top_domains = [d for d in top_domains if d not in whitelist_domains]

          # L2: JS Set — cap 25k để giữ RAM Set <= 2 MB/tab
          top_js_domains = [d for d, _ in domain_hits.most_common(25_000)]
          top_js_domains = [d for d in top_js_domains if d not in whitelist_domains]

          # L3: path substring, cap 800
          path_rules = sorted(path_rules, key=len)[:800]

          # ---- Ghi artifacts ----

          # L1: content_filter.json cho WebKit
          rules = []
          for d in top_domains:
              rules.append({
                  "trigger": {
                      "url-filter": d.replace(".", r"\."),
                      "url-filter-is-case-sensitive": False,
                  },
                  "action": {"type": "block"},
              })
          for d in sorted(whitelist_domains)[:500]:
              rules.append({
                  "trigger": {
                      "url-filter": d.replace(".", r"\."),
                      "url-filter-is-case-sensitive": False,
                  },
                  "action": {"type": "ignore-previous-rules"},
              })

          with open(os.path.join(RES, "content_filter.json"), "w") as f:
              json.dump(rules, f, separators=(",", ":"))
          print(f"[L1 content_filter.json] {len(rules)} entries "
                f"({len(top_domains)} block + {min(len(whitelist_domains),500)} ignore)")

          # L2: js_domains.json — capped at 25k
          with open(os.path.join(RES, "js_domains.json"), "w") as f:
              json.dump(sorted(top_js_domains), f, separators=(",", ":"))
          print(f"[L2 js_domains.json] {len(top_js_domains)} domains (capped)")

          # L3: js_paths.json
          with open(os.path.join(RES, "js_paths.json"), "w") as f:
              json.dump(path_rules, f, separators=(",", ":"))
          print(f"[L3 js_paths.json] {len(path_rules)} substrings")

          # Whitelist cho JS layer
          with open(os.path.join(RES, "js_whitelist.json"), "w") as f:
              json.dump(sorted(whitelist_domains), f, separators=(",", ":"))
          print(f"[js_whitelist.json] {len(whitelist_domains)} domains")

          if len(top_domains) < 3000:
              raise SystemExit(f"FATAL: only {len(top_domains)} L1 domains — sources broken")
          if len(top_js_domains) < 10000:
              raise SystemExit(f"FATAL: only {len(top_js_domains)} L2 domains — sources broken")

          # Xóa 3 file cũ nếu còn
          for stale in ("easylist.json", "easyprivacy.json", "fanboy_annoyance.json"):
              p = os.path.join(RES, stale)
              if os.path.exists(p):
                  os.remove(p)
                  print(f"removed stale {stale}")
          PY

      - name: Verify Distilled Artifacts
        run: |
          cd src-tauri/resources
          python3 - <<'PY'
          import json, os
          checks = [
              ("content_filter.json", (3000, 9000)),
              ("js_domains.json",    (10000, 30000)),
              ("js_paths.json",      (100, 2000)),
              ("js_whitelist.json",  (0, 5000)),
          ]
          for name, (lo, hi) in checks:
              assert os.path.exists(name), f"missing {name}"
              n = len(json.load(open(name)))
              assert lo <= n <= hi, f"{name}: {n} out of range [{lo},{hi}]"
              print(f"OK {name}: {n} entries, {os.path.getsize(name)}B")
          PY

      # ==================================================================
      # BUILD
      # ==================================================================
      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Prepare .deb Artifact
        run: |
          mkdir -p release-artifacts
          VERSION="${APP_VERSION:-1.0.0}"
          DEB_FILE=$(find target/release/bundle/deb src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-artifacts/vibird-browser_${VERSION}_amd64.deb"
            cp "$DEB_FILE" "release-artifacts/vibird-browser_amd64.deb"
          fi
          echo "=== .deb artifacts ==="
          ls -la release-artifacts/

      - name: Verify Artifacts Inside .deb
        run: |
          DEB_FILE=$(ls release-artifacts/vibird-browser_amd64.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: no .deb produced" >&2
            exit 1
          fi
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$OLDPWD/$DEB_FILE"
          tar -xf data.tar.*

          FOUND=0
          for f in content_filter.json js_domains.json js_paths.json js_whitelist.json; do
            PATH_FOUND=$(find . -name "$f" -type f | head -n 1)
            if [ -z "$PATH_FOUND" ]; then
              echo "WARN: $f not in .deb"
            else
              echo "OK: $f → $PATH_FOUND"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -lt 2 ]; then
            echo "ERROR: fewer than 2 filter artifacts inside .deb" >&2
            exit 1
          fi
          echo "Bundled $FOUND/4 artifacts"

      # ==================================================================
      # FLATPAK
      # ==================================================================
      - name: Install Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Prepare Flatpak Sources
        run: |
          cp release-artifacts/vibird-browser_amd64.deb flatpak/vibird-browser_amd64.deb
          cp src-tauri/icons/app-icon.svg flatpak/icon.svg
          echo "=== flatpak/ contents ==="
          ls -la flatpak/

      - name: Build Flatpak
        run: |
          VERSION="${APP_VERSION:-1.0.0}"

          flatpak-builder \
            --user \
            --force-clean \
            --repo=flatpak-repo \
            build-dir \
            flatpak/io.github.locshadowvn.Vibird.yml

          flatpak build-bundle \
            flatpak-repo \
            release-artifacts/vibird-browser_${VERSION}_amd64.flatpak \
            io.github.locshadowvn.Vibird

          cp release-artifacts/vibird-browser_${VERSION}_amd64.flatpak release-artifacts/vibird-browser_amd64.flatpak

          echo "=== Flatpak artifacts ==="
          ls -la release-artifacts/

      # ==================================================================
      # PUBLISH
      # ==================================================================
      - name: Upload Artifacts for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: Vibird-Browser-Linux-Build
          path: release-artifacts/*
          retention-days: 7

      - name: Publish GitHub Release (When tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
