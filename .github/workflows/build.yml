name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build .deb and Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Pre-built Trunk & Cargo Binstall
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Auto-Sync Version From Git Tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.0.0"
          fi
          echo "Detected Release Version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "0,/version = \"[^\"]+\"/s/version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate Vibird Browser App Icons
        run: |
          mkdir -p src-tauri/icons
          cat << 'EOF' > src-tauri/icons/app-icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <radialGradient id="vBg" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#141923"/>
                <stop offset="100%" stop-color="#080A0F"/>
              </radialGradient>
            </defs>
            <rect width="512" height="512" rx="116" fill="url(#vBg)"/>
            <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#222A38" stroke-width="2"/>
            <circle cx="256" cy="256" r="176" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15" stroke-dasharray="8, 8"/>
            <circle cx="256" cy="256" r="140" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
            <polygon points="210,310 145,210 160,150 240,240" fill="#996515" opacity="0.6"/>
            <polygon points="160,150 120,170 190,265" fill="#784E0E" opacity="0.4"/>
            <polygon points="235,395 140,230 170,120 280,270" fill="#D4AF37"/>
            <polygon points="170,120 135,145 220,295 235,395" fill="#B38622"/>
            <path d="M 235 395 
                     C 270 330, 310 260, 350 200 
                     L 435 125 
                     L 365 170 
                     C 335 195, 305 240, 275 305 
                     Z" 
                  fill="#E6B800"/>
            <polygon points="435,125 365,170 375,150" fill="#FFF2B2"/>
            <polygon points="345,185 240,165 315,198" fill="#F3E5AB"/>
            <polygon points="330,200 205,185 295,215" fill="#D4AF37"/>
            <polygon points="310,218 190,208 275,235" fill="#B38622"/>
            <polygon points="235,395 285,390 260,425" fill="#D4AF37" opacity="0.85"/>
            <polygon points="215,380 235,395 200,410" fill="#996515"/>
          </svg>
          EOF
          cargo tauri icon src-tauri/icons/app-icon.svg -o src-tauri/icons

      # ======================================================================
      # FETCH 3 LISTS
      # ======================================================================
      - name: Fetch EasyList (ads)
        run: |
          mkdir -p src-tauri/resources
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://easylist.to/easylist/easylist.txt" \
            -o src-tauri/resources/easylist_raw.txt \
            || echo "! easylist download failed" > src-tauri/resources/easylist_raw.txt
          LINES=$(wc -l < src-tauri/resources/easylist_raw.txt)
          echo "EasyList: $LINES lines"

      - name: Fetch EasyPrivacy (trackers)
        run: |
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://easylist.to/easylist/easyprivacy.txt" \
            -o src-tauri/resources/easyprivacy_raw.txt \
            || echo "! easyprivacy download failed" > src-tauri/resources/easyprivacy_raw.txt
          LINES=$(wc -l < src-tauri/resources/easyprivacy_raw.txt)
          echo "EasyPrivacy: $LINES lines"

      - name: Fetch Fanboy Annoyance (cookie banners, annoyances)
        run: |
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://secure.fanboy.co.nz/fanboy-annoyance.txt" \
            -o src-tauri/resources/fanboy_annoyance_raw.txt \
            || echo "! fanboy-annoyance download failed" > src-tauri/resources/fanboy_annoyance_raw.txt
          LINES=$(wc -l < src-tauri/resources/fanboy_annoyance_raw.txt)
          echo "Fanboy Annoyance: $LINES lines"

      # ======================================================================
      # MERGE RAW LISTS → rules.txt CHO JS LAYER
      # ======================================================================
      - name: Merge Raw Lists for JS Layer
        run: |
          cd src-tauri/resources
          {
            cat easylist_raw.txt
            cat easyprivacy_raw.txt
            cat fanboy_annoyance_raw.txt
          } > rules.txt
          LINES=$(wc -l < rules.txt)
          echo "Merged $LINES lines into rules.txt for JS layer"

      # ======================================================================
      # CONVERT ABP → SAFARI CONTENT BLOCKER JSON
      #
      # CHỈ giữ domain rules (||domain^). Bỏ path rules, URL rules, wildcard.
      #
      # Lý do: WebKit content blocker là all-or-nothing. 1 rule vi phạm
      # syntax → cả file JSON fail compile. Python re.escape() sinh ra
      # \- \+ \  mà WebKit không hiểu. Chỉ giữ domain an toàn.
      # ======================================================================
      - name: Convert All Lists to JSON (domain-only)
        run: |
          python3 - <<'PY'
          import json, re, os

          MAX_RULES = 40_000

          # Chỉ accept: chữ, số, dấu chấm, gạch ngang, gạch dưới.
          DOMAIN_RE = re.compile(r'^[a-zA-Z0-9._-]+$')

          SOURCES = [
              ("easylist_raw.txt",         "easylist.json"),
              ("easyprivacy_raw.txt",      "easyprivacy.json"),
              ("fanboy_annoyance_raw.txt", "fanboy_annoyance.json"),
          ]

          def esc(d):
              # Chỉ escape dấu chấm. WebKit hiểu \. là literal dot.
              return d.replace(".", r"\.")

          def convert(src, dst):
              block, ignore = [], []
              seen_b, seen_i = set(), set()
              skip = 0

              path_src = os.path.join("src-tauri/resources", src)
              path_dst = os.path.join("src-tauri/resources", dst)

              if not os.path.exists(path_src):
                  print(f"[{src}] not found, writing empty")
                  with open(path_dst, "w") as f:
                      f.write("[]")
                  return

              def push_block(pat):
                  k = pat.lower()
                  if k in seen_b:
                      return
                  seen_b.add(k)
                  block.append({
                      "trigger": {
                          "url-filter": pat,
                          "url-filter-is-case-sensitive": False,
                      },
                      "action": {"type": "block"},
                  })

              def push_ignore(pat):
                  k = pat.lower()
                  if k in seen_i:
                      return
                  seen_i.add(k)
                  ignore.append({
                      "trigger": {
                          "url-filter": pat,
                          "url-filter-is-case-sensitive": False,
                      },
                      "action": {"type": "ignore-previous-rules"},
                  })

              with open(path_src, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("!") or line.startswith("["):
                          continue

                      is_exc = line.startswith("@@")
                      if is_exc:
                          line = line[2:]

                      if "$" in line:
                          line = line.split("$", 1)[0]
                      if not line:
                          continue

                      if not line.startswith("||"):
                          skip += 1
                          continue

                      rest = line[2:]
                      domain = re.split(r"[\^/]", rest, 1)[0].strip()

                      if not domain:
                          skip += 1
                          continue
                      if len(domain) > 128:
                          skip += 1
                          continue
                      if not DOMAIN_RE.match(domain):
                          skip += 1
                          continue
                      if "." not in domain:
                          skip += 1
                          continue

                      pat = esc(domain)
                      if is_exc:
                          push_ignore(pat)
                      else:
                          push_block(pat)

                      if len(block) + len(ignore) >= MAX_RULES:
                          break

              all_rules = block + ignore
              with open(path_dst, "w") as f:
                  json.dump(all_rules, f, separators=(",", ":"))

              size = os.path.getsize(path_dst)
              print(f"[{src}] block={len(block)} ignore={len(ignore)} skip={skip} → {size} bytes")

          for src, dst in SOURCES:
              convert(src, dst)
          PY

      # ======================================================================
      # VERIFY JSON
      # ======================================================================
      - name: Verify JSON
        run: |
          cd src-tauri/resources
          for f in easylist.json easyprivacy.json fanboy_annoyance.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              RULES=$(python3 -c "import json; print(len(json.load(open('$f'))))" 2>/dev/null || echo "?")
              echo "$f: $SIZE bytes, $RULES rules"
            else
              echo "$f: MISSING"
            fi
          done

          TOTAL=$(cat easylist.json easyprivacy.json fanboy_annoyance.json 2>/dev/null | wc -c)
          if [ "$TOTAL" -lt 50000 ]; then
            echo "ERROR: total JSON too small ($TOTAL bytes)" >&2
            exit 1
          fi
          echo "Total: $TOTAL bytes"

      # ======================================================================
      # BUILD
      # ======================================================================
      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Prepare .deb Artifact
        run: |
          mkdir -p release-artifacts
          VERSION="${APP_VERSION:-1.0.0}"
          DEB_FILE=$(find target/release/bundle/deb src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-artifacts/vibird-browser_${VERSION}_amd64.deb"
            cp "$DEB_FILE" "release-artifacts/vibird-browser_amd64.deb"
          fi
          echo "=== .deb artifacts ==="
          ls -la release-artifacts/

      - name: Verify All 3 JSONs Bundled In .deb
        run: |
          DEB_FILE=$(ls release-artifacts/vibird-browser_amd64.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: no .deb produced" >&2
            exit 1
          fi
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$OLDPWD/$DEB_FILE"
          tar -xf data.tar.*

          FOUND=0
          for f in easylist.json easyprivacy.json fanboy_annoyance.json; do
            PATH_FOUND=$(find . -name "$f" -type f | head -n 1)
            if [ -z "$PATH_FOUND" ]; then
              echo "WARN: $f not in .deb"
            else
              echo "OK: $f → $PATH_FOUND"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no content filter JSON inside .deb" >&2
            exit 1
          fi
          echo "Bundled $FOUND/3 JSON files"

      # ======================================================================
      # FLATPAK
      # ======================================================================
      - name: Install Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Prepare Flatpak Sources
        run: |
          cp release-artifacts/vibird-browser_amd64.deb flatpak/vibird-browser_amd64.deb
          cp src-tauri/icons/app-icon.svg flatpak/icon.svg
          echo "=== flatpak/ contents ==="
          ls -la flatpak/

      - name: Build Flatpak
        run: |
          VERSION="${APP_VERSION:-1.0.0}"

          flatpak-builder \
            --user \
            --force-clean \
            --repo=flatpak-repo \
            build-dir \
            flatpak/io.github.locshadowvn.Vibird.yml

          flatpak build-bundle \
            flatpak-repo \
            release-artifacts/vibird-browser_${VERSION}_amd64.flatpak \
            io.github.locshadowvn.Vibird

          cp release-artifacts/vibird-browser_${VERSION}_amd64.flatpak release-artifacts/vibird-browser_amd64.flatpak

          echo "=== Flatpak artifacts ==="
          ls -la release-artifacts/

      # ======================================================================
      # PUBLISH
      # ======================================================================
      - name: Upload Artifacts for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: Vibird-Browser-Linux-Build
          path: release-artifacts/*
          retention-days: 7

      - name: Publish GitHub Release (When tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
