name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build .deb and Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Pre-built Trunk & Cargo Binstall
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Auto-Sync Version From Git Tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.0.0"
          fi
          echo "Detected Release Version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "0,/version = \"[^\"]+\"/s/version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate Vibird Browser App Icons
        run: |
          mkdir -p src-tauri/icons
          cat << 'EOF' > src-tauri/icons/app-icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <radialGradient id="vBg" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#141923"/>
                <stop offset="100%" stop-color="#080A0F"/>
              </radialGradient>
            </defs>
            <rect width="512" height="512" rx="116" fill="url(#vBg)"/>
            <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#222A38" stroke-width="2"/>
            <circle cx="256" cy="256" r="176" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15" stroke-dasharray="8, 8"/>
            <circle cx="256" cy="256" r="140" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
            <polygon points="210,310 145,210 160,150 240,240" fill="#996515" opacity="0.6"/>
            <polygon points="160,150 120,170 190,265" fill="#784E0E" opacity="0.4"/>
            <polygon points="235,395 140,230 170,120 280,270" fill="#D4AF37"/>
            <polygon points="170,120 135,145 220,295 235,395" fill="#B38622"/>
            <path d="M 235 395 
                     C 270 330, 310 260, 350 200 
                     L 435 125 
                     L 365 170 
                     C 335 195, 305 240, 275 305 
                     Z" 
                  fill="#E6B800"/>
            <polygon points="435,125 365,170 375,150" fill="#FFF2B2"/>
            <polygon points="345,185 240,165 315,198" fill="#F3E5AB"/>
            <polygon points="330,200 205,185 295,215" fill="#D4AF37"/>
            <polygon points="310,218 190,208 275,235" fill="#B38622"/>
            <polygon points="235,395 285,390 260,425" fill="#D4AF37" opacity="0.85"/>
            <polygon points="215,380 235,395 200,410" fill="#996515"/>
          </svg>
          EOF
          cargo tauri icon src-tauri/icons/app-icon.svg -o src-tauri/icons

      - name: Fetch and Bundle EasyList Rules
        run: |
          mkdir -p src-tauri/resources
          {
            curl --retry 3 --retry-delay 5 -fsSL "https://easylist.to/easylist/easylist.txt" || echo "! easylist download failed"
            curl --retry 3 --retry-delay 5 -fsSL "https://easylist.to/easylist/easyprivacy.txt" || echo "! easyprivacy download failed"
            curl --retry 3 --retry-delay 5 -fsSL "https://secure.fanboy.co.nz/fanboy-annoyance.txt" || echo "! fanboy-annoyance download failed"
          } > src-tauri/resources/rules.txt
          LINES=$(wc -l < src-tauri/resources/rules.txt)
          echo "Bundled $LINES ABP rules into installer."

      - name: Convert ABP Rules to Safari Content Blocker JSON
        run: |
          python3 - <<'PY'
          import json, re

          RULES_FILE = "src-tauri/resources/rules.txt"
          OUT_FILE = "src-tauri/resources/easylist_content_blocker.json"
          MAX_RULES = 80_000

          rules = []
          seen = set()
          skipped = 0
          stats = {"domain": 0, "url": 0, "path": 0, "wildcard": 0}

          def add_rule(pattern):
              key = pattern.lower()
              if key in seen:
                  return
              seen.add(key)
              rules.append({
                  "trigger": {
                      "url-filter": pattern,
                      "url-filter-is-case-sensitive": False,
                  },
                  "action": {"type": "block"},
              })

          def escape_domain(d):
              # Escape các ký tự regex đặc biệt trong domain.
              return re.sub(r'([.])', r'\\.', d)

          with open(RULES_FILE, encoding="utf-8", errors="ignore") as f:
              for line in f:
                  line = line.strip()
                  # Skip comment + section header + whitelist.
                  if not line or line.startswith("!") or line.startswith("["):
                      continue
                  if line.startswith("@@"):
                      continue

                  # Bỏ options ($script, $third-party, ...). Giữ pattern.
                  if "$" in line:
                      line = line.split("$", 1)[0]
                  if not line:
                      continue

                  # ============================================================
                  # 1. Domain anchor: ||domain^ hoặc ||domain/path
                  #    → chỉ lấy domain (bỏ path, vì Safari regex hỗ trợ
                  #      nhưng cần exact match trước dấu /)
                  # ============================================================
                  if line.startswith("||"):
                      rest = line[2:]
                      # Bỏ path nếu có: domain^path hoặc domain/path
                      domain = re.split(r"[\^/]", rest, 1)[0]
                      if not domain or "*" in domain:
                          skipped += 1
                          continue
                      if "." not in domain or len(domain) > 128:
                          skipped += 1
                          continue
                      # Domain phải hợp lệ: chỉ chữ, số, gạch, chấm.
                      if not re.match(r"^[a-zA-Z0-9._-]+$", domain):
                          skipped += 1
                          continue
                      pattern = escape_domain(domain)
                      add_rule(pattern)
                      stats["domain"] += 1

                  # ============================================================
                  # 2. Full-URL anchor: |http://host hoặc |https://host
                  #    → chặn URL bắt đầu bằng protocol + host cụ thể
                  # ============================================================
                  elif line.startswith("|http://") or line.startswith("|https://"):
                      m = re.match(r"^\|(https?://[^/*]+)", line)
                      if m:
                          host_part = m.group(1)
                          # host_part = "https://domain.com"
                          host = host_part.split("://", 1)[1]
                          if (
                              "." in host
                              and len(host) <= 128
                              and "*" not in host
                              and re.match(r"^[a-zA-Z0-9._-]+$", host)
                          ):
                              # Pattern: bắt đầu bằng protocol (|) + host
                              # Safari dùng "^https?://" cho protocol optional.
                              pattern = r"^https?://" + escape_domain(host)
                              add_rule(pattern)
                              stats["url"] += 1
                          else:
                              skipped += 1
                      else:
                          skipped += 1

                  # ============================================================
                  # 3. Path-only rules: /ads/*, /banner/, /track/*
                  #    Chỉ lấy những path có ý nghĩa, độ dài 3-40, không wildcard giữa
                  # ============================================================
                  elif line.startswith("/") and len(line) >= 4:
                      # Bỏ /* ở cuối nếu có
                      path = line
                      if path.endswith("/*"):
                          path = path[:-2]
                      elif path.endswith("*"):
                          path = path[:-1]
                      # Path sạch: bắt đầu bằng /, không có * hoặc | ở giữa
                      if (
                          path.startswith("/")
                          and 3 <= len(path) <= 40
                          and "*" not in path
                          and "|" not in path
                          and "?" not in path
                          # Bỏ path quá generic (chỉ 1-2 ký tự)
                          and len(path.strip("/")) >= 3
                      ):
                          pattern = re.escape(path) + "/?"
                          add_rule(pattern)
                          stats["path"] += 1
                      else:
                          skipped += 1

                  # ============================================================
                  # 4. Wildcard host: *://*.domain.com/*
                  # ============================================================
                  elif line.startswith("*://"):
                      m = re.match(r"^\*://\*?\.?([a-zA-Z0-9._-]+)", line)
                      if m:
                          host = m.group(1)
                          if (
                              "." in host
                              and len(host) <= 128
                              and re.match(r"^[a-zA-Z0-9._-]+$", host)
                          ):
                              pattern = escape_domain(host)
                              add_rule(pattern)
                              stats["wildcard"] += 1
                          else:
                              skipped += 1
                      else:
                          skipped += 1

                  else:
                      skipped += 1

                  if len(rules) >= MAX_RULES:
                      break

          with open(OUT_FILE, "w") as f:
              json.dump(rules, f, separators=(",", ":"))

          total = len(rules)
          print(f"=== Content Blocker Conversion ===")
          print(f"Total rules:   {total}")
          print(f"  domain:      {stats['domain']}")
          print(f"  full URL:    {stats['url']}")
          print(f"  path:        {stats['path']}")
          print(f"  wildcard:    {stats['wildcard']}")
          print(f"Skipped:       {skipped}")
          PY

      - name: Verify Content Blocker JSON
        run: |
          JSON_FILE="src-tauri/resources/easylist_content_blocker.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "ERROR: $JSON_FILE not generated" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$JSON_FILE")
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: $JSON_FILE too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Content blocker JSON: $SIZE bytes"
          ls -la src-tauri/resources/

      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Prepare .deb Artifact
        run: |
          mkdir -p release-artifacts
          VERSION="${APP_VERSION:-1.0.0}"
          DEB_FILE=$(find target/release/bundle/deb src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-artifacts/vibird-browser_${VERSION}_amd64.deb"
            cp "$DEB_FILE" "release-artifacts/vibird-browser_amd64.deb"
          fi
          echo "=== .deb artifacts ==="
          ls -la release-artifacts/

      - name: Verify JSON Bundled In .deb
        run: |
          DEB_FILE=$(ls release-artifacts/vibird-browser_amd64.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: no .deb produced" >&2
            exit 1
          fi
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$OLDPWD/$DEB_FILE"
          tar -xf data.tar.*
          JSON_IN_DEB=$(find . -name "easylist_content_blocker.json" -type f | head -n 1)
          if [ -z "$JSON_IN_DEB" ]; then
            echo "ERROR: easylist_content_blocker.json NOT found inside .deb" >&2
            exit 1
          fi
          echo "OK: JSON is bundled inside .deb at $JSON_IN_DEB"

      - name: Install Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Prepare Flatpak Sources
        run: |
          cp release-artifacts/vibird-browser_amd64.deb flatpak/vibird-browser_amd64.deb
          cp src-tauri/icons/app-icon.svg flatpak/icon.svg
          echo "=== flatpak/ contents ==="
          ls -la flatpak/

      - name: Build Flatpak
        run: |
          VERSION="${APP_VERSION:-1.0.0}"

          flatpak-builder \
            --user \
            --force-clean \
            --repo=flatpak-repo \
            build-dir \
            flatpak/io.github.locshadowvn.Vibird.yml

          flatpak build-bundle \
            flatpak-repo \
            release-artifacts/vibird-browser_${VERSION}_amd64.flatpak \
            io.github.locshadowvn.Vibird

          cp release-artifacts/vibird-browser_${VERSION}_amd64.flatpak release-artifacts/vibird-browser_amd64.flatpak

          echo "=== Flatpak artifacts ==="
          ls -la release-artifacts/

      - name: Upload Artifacts for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: Vibird-Browser-Linux-Build
          path: release-artifacts/*
          retention-days: 7

      - name: Publish GitHub Release (When tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
