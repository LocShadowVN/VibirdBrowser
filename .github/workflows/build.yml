name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build .deb and .AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Pre-built Trunk & Cargo Binstall
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Auto-Sync Version From Git Tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.0.0"
          fi
          echo "Detected Release Version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "0,/version = \"[^\"]+\"/s/version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate Vibird Browser App Icons
        run: |
          mkdir -p src-tauri/icons
          cat << 'EOF' > src-tauri/icons/app-icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#1E293B"/>
                <stop offset="100%" stop-color="#090D16"/>
              </radialGradient>
              <linearGradient id="vibirdBronze" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FDE68A"/>
                <stop offset="40%" stop-color="#F59E0B"/>
                <stop offset="80%" stop-color="#D97706"/>
                <stop offset="100%" stop-color="#92400E"/>
              </linearGradient>
              <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FBBF24"/>
                <stop offset="50%" stop-color="#D97706"/>
                <stop offset="100%" stop-color="#38BDF8"/>
              </linearGradient>
              <linearGradient id="cyberWing" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#F59E0B"/>
                <stop offset="60%" stop-color="#FB923C"/>
                <stop offset="100%" stop-color="#38BDF8"/>
              </linearGradient>
              <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="12" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>
            <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
            <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#shieldBorder)" stroke-width="3" opacity="0.4"/>
            <g transform="translate(0, 10)">
              <path d="M256 64 L396 112 V248 C396 342 334 416 256 448 C178 416 116 342 116 248 V112 Z" 
                    fill="#111827" stroke="url(#shieldBorder)" stroke-width="8" stroke-linejoin="round" filter="url(#neonGlow)"/>
              <path d="M256 86 L376 128 V246 C376 324 324 388 256 418 C188 388 136 324 136 246 V128 Z" 
                    fill="#0B0F19" stroke="url(#vibirdBronze)" stroke-width="2" opacity="0.8"/>
              <g opacity="0.35" transform="translate(256, 252)">
                <circle r="92" fill="none" stroke="url(#vibirdBronze)" stroke-width="2" stroke-dasharray="6,4"/>
                <circle r="72" fill="none" stroke="url(#vibirdBronze)" stroke-width="1.5"/>
                <circle r="48" fill="none" stroke="url(#vibirdBronze)" stroke-width="2" stroke-dasharray="3,3"/>
                <polygon points="0,-68 7,-24 0,-14 -7,-24" fill="url(#vibirdBronze)"/>
                <polygon points="0,68 7,24 0,14 -7,24" fill="url(#vibirdBronze)"/>
                <polygon points="-68,0 -24,7 -14,0 -24,-7" fill="url(#vibirdBronze)"/>
                <polygon points="68,0 24,7 14,0 24,-7" fill="url(#vibirdBronze)"/>
                <circle r="14" fill="url(#vibirdBronze)"/>
              </g>
              <path d="M 235 275 Q 170 200 130 155 Q 185 180 230 220 Q 180 150 145 110 Q 215 140 260 190 Q 230 110 200 80 Q 280 130 290 200 Z" fill="url(#cyberWing)" opacity="0.95"/>
              <path d="M 195 340 C 215 320, 245 285, 260 250 C 275 215, 290 170, 320 142 C 338 126, 362 118, 388 114 C 362 126, 345 142, 335 158 C 320 182, 312 210, 305 240 C 290 290, 255 338, 218 360 Z" fill="url(#vibirdBronze)"/>
              <path d="M 218 360 Q 260 355 295 385 Q 255 372 205 352 Z" fill="#F59E0B" opacity="0.8"/>
              <polygon points="388,114 348,138 335,130" fill="#FDE68A"/>
              <circle cx="340" cy="142" r="3.5" fill="#38BDF8" filter="url(#neonGlow)"/>
            </g>
          </svg>
          EOF
          cargo tauri icon src-tauri/icons/app-icon.svg -o src-tauri/icons

      - name: Fetch and Bundle EasyList Rules (ABP text for adblock-rust)
        run: |
          mkdir -p src-tauri/resources
          {
            curl --retry 3 --retry-delay 5 -fsSL "https://easylist.to/easylist/easylist.txt" || echo "! easylist download failed"
            curl --retry 3 --retry-delay 5 -fsSL "https://easylist.to/easylist/easyprivacy.txt" || echo "! easyprivacy download failed"
            curl --retry 3 --retry-delay 5 -fsSL "https://secure.fanboy.co.nz/fanboy-annoyance.txt" || echo "! fanboy-annoyance download failed"
          } > src-tauri/resources/rules.txt
          LINES=$(wc -l < src-tauri/resources/rules.txt)
          echo "Bundled $LINES ABP rules into installer."
          if [ "$LINES" -lt 1000 ]; then
            echo "::warning::Rules file seems too small — check download sources"
          fi

      - name: Fetch EasyList Content Blocker JSON (for WebKit UserContentFilter)
        run: |
          mkdir -p src-tauri/resources
          curl --retry 3 --retry-delay 5 -fsSL \
            "https://easylist-downloads.adblockplus.org/easylist_content_blocker.json" \
            -o src-tauri/resources/easylist_content_blocker.json
          
          if [ ! -s src-tauri/resources/easylist_content_blocker.json ]; then
            echo "::warning::Content blocker JSON download failed — network-level adblock disabled"
            echo "[]" > src-tauri/resources/easylist_content_blocker.json
          else
            SIZE=$(wc -c < src-tauri/resources/easylist_content_blocker.json)
            echo "Content blocker JSON size: $SIZE bytes"
            if [ "$SIZE" -lt 100000 ]; then
              echo "::warning::Content blocker JSON too small — probably incomplete"
            fi
          fi

      - name: Verify Bundled Resources
        run: |
          echo "=== src-tauri/resources/ ==="
          ls -la src-tauri/resources/
          echo ""
          echo "rules.txt lines: $(wc -l < src-tauri/resources/rules.txt)"
          echo "content_blocker.json size: $(wc -c < src-tauri/resources/easylist_content_blocker.json) bytes"

      - name: Build Full Vibird Browser App
        run: cargo tauri build

      - name: Normalize & Prepare Release Binaries
        run: |
          mkdir -p release-artifacts
          VERSION="${APP_VERSION:-1.0.0}"

          DEB_FILE=$(find target/release/bundle/deb src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-artifacts/vibird-browser_${VERSION}_amd64.deb"
            cp "$DEB_FILE" "release-artifacts/vibird-browser_amd64.deb"
          fi

          APPIMAGE_FILE=$(find target/release/bundle/appimage src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "release-artifacts/vibird-browser_${VERSION}_amd64.AppImage"
            cp "$APPIMAGE_FILE" "release-artifacts/vibird-browser_amd64.AppImage"
          fi

          for BIN in "target/release/vibird-browser" \
                     "src-tauri/target/release/vibird-browser" \
                     "target/release/caram-browser" \
                     "src-tauri/target/release/caram-browser"; do
            if [ -f "$BIN" ]; then
              cp "$BIN" release-artifacts/vibird-browser
              break
            fi
          done

          echo "=== Release artifacts for v$VERSION ==="
          ls -la release-artifacts/

      - name: Upload Artifacts for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: Vibird-Browser-Linux-Build
          path: release-artifacts/*
          retention-days: 7

      - name: Publish GitHub Release (When tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
