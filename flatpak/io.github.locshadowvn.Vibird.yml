app-id: io.github.locshadowvn.Vibird
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vibird-browser

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-data/vibird-browser:create

modules:
  - name: vibird-browser
    buildsystem: simple
    build-commands:
      # ------------------------------------------------------------------
      # Extract .deb — dùng --strip-components=2 để bỏ "./usr/"
      # Ví dụ: ./usr/bin/vibird-browser  →  /app/bin/vibird-browser
      #        ./usr/share/icons/...     →  /app/share/icons/...
      # ------------------------------------------------------------------
      - |
        DEB_FILE=$(ls vibird-browser_amd64.deb 2>/dev/null | head -n 1)
        if [ -z "$DEB_FILE" ]; then
          echo "ERROR: no .deb found in build directory" >&2
          exit 1
        fi
        ar x "$DEB_FILE"
        tar -xf data.tar.* --strip-components=2 -C /app/
        rm -f control.tar.* data.tar.* debian-binary

      # ------------------------------------------------------------------
      # Debug: list what got installed
      # ------------------------------------------------------------------
      - |
        echo "=== /app/bin ==="
        ls -la /app/bin/ 2>/dev/null || echo "(empty)"
        echo "=== /app/share/applications ==="
        ls -la /app/share/applications/ 2>/dev/null || echo "(empty)"
        echo "=== /app/share/icons ==="
        find /app/share/icons -type f 2>/dev/null | head -20 || echo "(empty)"

      # ------------------------------------------------------------------
      # Remove Tauri's desktop file (tên có space "Vibird Browser.desktop")
      # ------------------------------------------------------------------
      - |
        rm -f "/app/share/applications/Vibird Browser.desktop"
        rm -f "/app/share/applications/vibird-browser.desktop"

      # Install our desktop file
      - install -Dm644 io.github.locshadowvn.Vibird.desktop /app/share/applications/io.github.locshadowvn.Vibird.desktop

      # Install metainfo
      - install -Dm644 io.github.locshadowvn.Vibird.metainfo.xml /app/share/metainfo/io.github.locshadowvn.Vibird.metainfo.xml

      # Install SVG icon (source bundled)
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.locshadowvn.Vibird.svg

      # Copy any existing PNG icons to correct name/size
      - |
        for SIZE in 32x32 64x64 128x128 256x256 512x512; do
          SRC=$(ls /app/share/icons/hicolor/$SIZE/apps/*.png 2>/dev/null | head -n 1)
          if [ -n "$SRC" ]; then
            install -Dm644 "$SRC" /app/share/icons/hicolor/$SIZE/apps/io.github.locshadowvn.Vibird.png
            echo "Copied $SIZE icon: $SRC"
          fi
        done

    sources:
      - type: file
        path: vibird-browser_amd64.deb
      - type: file
        path: io.github.locshadowvn.Vibird.desktop
      - type: file
        path: io.github.locshadowvn.Vibird.metainfo.xml
      - type: file
        path: icon.svg
